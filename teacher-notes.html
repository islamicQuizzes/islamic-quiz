<!DOCTYPE html>
<html lang="ckb" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>گەڕانەوە بۆ داشبۆرد</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --paper: #fbf4e3;
            --paper-dark: #efe0c0;

            --brown-dark: #3b2618;
            --brown: #674832;

            --gold: #b08a3c;
            --gold-light: #d7bc78;

            --green: #294c3a;
            --green-dark: #193629;

            --border: #c9ad72;

            --shadow: rgba(59, 38, 24, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            direction: rtl;
            min-height: 100%;
        }

        body {
            font-family:
                "Amozh",
                "Tahoma",
                sans-serif;

            color: var(--brown-dark);

            background:
                radial-gradient(
                    circle at top,
                    rgba(176, 138, 60, 0.15),
                    transparent 45%
                ),
                linear-gradient(
                    135deg,
                    #ead9b5,
                    #f8efd9,
                    #ead9b5
                );
        }

        .page-container {
            width: 100%;
            max-width: 900px;
            min-height: 100vh;

            margin: 0 auto;

            padding: 25px 18px 60px;
        }

        /* ===============================
           BACK BUTTON
           =============================== */

        .back-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 10px;

            min-height: 50px;

            padding: 12px 22px;

            margin-bottom: 20px;

            color: #fff8e8;

            background:
                linear-gradient(
                    135deg,
                    var(--green),
                    var(--green-dark)
                );

            border: 2px solid var(--gold);

            border-radius: 10px;

            box-shadow:
                0 6px 18px var(--shadow);

            font-family:
                "Amozh",
                "Tahoma",
                sans-serif;

            font-size: 17px;
            font-weight: 700;

            text-decoration: none;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 9px 22px var(--shadow);

            background:
                linear-gradient(
                    135deg,
                    #355d49,
                    var(--green-dark)
                );
        }

        .back-button:active {
            transform: translateY(0);
        }

        .back-arrow {
            font-size: 22px;
            line-height: 1;
        }

        /* ===============================
           EMPTY PAGE
           =============================== */

        .empty-page {
            padding: 60px 25px;

            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 250, 239, 0.98),
                    rgba(244, 231, 199, 0.98)
                );

            border: 2px solid var(--gold);

            border-radius: 8px;

            box-shadow:
                0 10px 30px var(--shadow),
                inset
                0 0 0 5px
                rgba(176, 138, 60, 0.06);
        }

        .empty-page::before {
            content: "❖  ✦  ❖";

            display: block;

            margin-bottom: 20px;

            color: var(--gold);

            font-size: 18px;

            letter-spacing: 7px;
        }

        .empty-page::after {
            content: "❖  ✦  ❖";

            display: block;

            margin-top: 25px;

            color: var(--gold);

            font-size: 16px;

            letter-spacing: 7px;
        }

        .empty-page h1 {
            color: var(--green-dark);

            font-size: 30px;

            line-height: 1.6;
        }

        .empty-page p {
            margin-top: 10px;

            color: var(--brown);

            font-size: 16px;

            line-height: 1.9;
        }

        /* ===============================
           MOBILE
           =============================== */

        @media (max-width: 600px) {

            .page-container {
                padding:
                    15px 10px 40px;
            }

            .back-button {
                width: 100%;
            }

            .empty-page {
                padding:
                    45px 18px;
            }

            .empty-page h1 {
                font-size: 25px;
            }

            .empty-page p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="page-container">

        <!-- BACK BUTTON -->
        <a
            href="teacher.html"
            class="back-button"
        >
            <span class="back-arrow">→</span>

            گەڕانەوە بۆ داشبۆرد
        </a>


        <!-- PAGE -->
        <section class="empty-page">

            <h1>
                داشبۆردی مامۆستا
            </h1>

            <p>
                بۆ گەڕانەوە بۆ داشبۆردەکە،
                دوگمەی سەرەوە بەکاربهێنە.
            </p>

        </section>

    </main>

</body>

</html>
