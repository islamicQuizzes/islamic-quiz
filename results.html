<!DOCTYPE html>
<html lang="ckb" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ئەنجامەکان - پرسیار لە ئێمە و وەڵام لە تۆ
</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="quiz-container">

        <header class="quiz-header">

            <div class="logo">
پرسیار لە ئێمە و وەڵام لە تۆ
            </div>

            <a href="teacher.html">
                گەڕانەوە
            </a>

        </header>


        <main class="create-content">

            <h1>
                ئەنجامەکانی تاقیکردنەوە
            </h1>

            <p
                id="quiz-title"
                class="subtitle"
            >
                ئەنجامەکان بار دەکرێن...
            </p>


            <div id="loading">
                ئەنجامەکان بار دەکرێن...
            </div>


            <!-- Statistics -->

            <div
                id="statistics"
                style="
                    display: none;
                    grid-template-columns:
                        repeat(
                            auto-fit,
                            minmax(160px, 1fr)
                        );
                    gap: 15px;
                    margin: 25px 0 35px;
                "
            >

                <div
                    class="quiz-form"
                    style="
                        margin: 0;
                        text-align: center;
                    "
                >

                    <h2
                        id="student-count"
                        style="
                            font-size: 30px;
                            margin-bottom: 5px;
                        "
                    >
                        ٠
                    </h2>

                    <p>
                        ژمارەی خوێندکاران
                    </p>

                </div>


                <div
                    class="quiz-form"
                    style="
                        margin: 0;
                        text-align: center;
                    "
                >

                    <h2
                        id="highest-score"
                        style="
                            font-size: 30px;
                            margin-bottom: 5px;
                        "
                    >
                        ٠٪
                    </h2>

                    <p>
                        بەرزترین نمرە
                    </p>

                </div>


                <div
                    class="quiz-form"
                    style="
                        margin: 0;
                        text-align: center;
                    "
                >

                    <h2
                        id="average-score"
                        style="
                            font-size: 30px;
                            margin-bottom: 5px;
                        "
                    >
                        ٠٪
                    </h2>

                    <p>
                        تێکڕای نمرەکان
                    </p>

                </div>

            </div>


            <h2 class="ranking-title">
                🏆 ڕیزبەندی خوێندکاران
            </h2>


            <div id="results-list"></div>

        </main>

    </div>


    <script type="module">

        import {
            auth,
            database
        } from "./js/firebase.js";


        import {
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        import {
            ref,
            get,
            remove
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


        // وەرگرتنی ناسنامەی تاقیکردنەوە

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const quizId =
            urlParams.get("id");


        // Elements

        const loading =
            document.getElementById(
                "loading"
            );


        const resultsList =
            document.getElementById(
                "results-list"
            );


        const quizTitle =
            document.getElementById(
                "quiz-title"
            );


        const statistics =
            document.getElementById(
                "statistics"
            );


        const studentCount =
            document.getElementById(
                "student-count"
            );


        const highestScore =
            document.getElementById(
                "highest-score"
            );


        const averageScore =
            document.getElementById(
                "average-score"
            );


        // پشکنینی چوونەژوورەوە

        onAuthStateChanged(
            auth,
            function (user) {

                if (!user) {

                    window.location.href =
                        "login.html";

                    return;

                }


                if (!quizId) {

                    loading.textContent =
                        "تاقیکردنەوەکە نەدۆزرایەوە.";

                    return;

                }


                loadResults();

            }
        );


        // بارکردنی ئەنجامەکان

        async function loadResults() {

            try {

                // بارکردنی تاقیکردنەوە

                const quizRef =
                    ref(
                        database,
                        "quizzes/" + quizId
                    );


                const quizSnapshot =
                    await get(
                        quizRef
                    );


                if (!quizSnapshot.exists()) {

                    loading.textContent =
                        "ئەم تاقیکردنەوەیە بوونی نییە.";

                    return;

                }


                const quiz =
                    quizSnapshot.val();


                quizTitle.textContent =
                    quiz.title ||
                    "تاقیکردنەوە";


                // بارکردنی ئەنجامەکان

                const resultsRef =
                    ref(
                        database,
                        "results/" + quizId
                    );


                const resultsSnapshot =
                    await get(
                        resultsRef
                    );


                loading.style.display =
                    "none";


                if (!resultsSnapshot.exists()) {

                    statistics.style.display =
                        "none";


                    resultsList.innerHTML = `

                        <div class="quiz-form">

                            <h2>
                                هیچ ئەنجامێک نییە
                            </h2>

                            <p>
                                هێشتا هیچ خوێندکارێک ئەم تاقیکردنەوەیەی تەواو نەکردووە.
                            </p>

                        </div>

                    `;

                    return;

                }


                const results =
                    resultsSnapshot.val();


                const entries =
                    Object.entries(
                        results
                    );


                // ڕیزکردنی ئەنجامەکان

                entries.sort(
                    function (a, b) {

                        return (
                            Number(
                                b[1].percentage
                            ) -
                            Number(
                                a[1].percentage
                            )
                        );

                    }
                );


                // Statistics

                const totalStudents =
                    entries.length;


                let highest =
                    0;


                let percentageTotal =
                    0;


                entries.forEach(
                    function ([resultId, result]) {

                        const percentage =
                            Number(
                                result.percentage
                            ) || 0;


                        if (
                            percentage >
                            highest
                        ) {

                            highest =
                                percentage;

                        }


                        percentageTotal +=
                            percentage;

                    }
                );


                const average =
                    totalStudents > 0
                        ? (
                            percentageTotal /
                            totalStudents
                        ).toFixed(1)
                        : 0;


                studentCount.textContent =
                    totalStudents;


                highestScore.textContent =
                    highest + "%";


                averageScore.textContent =
                    average + "%";


                statistics.style.display =
                    "grid";


                // پاککردنەوەی لیستی پێشوو

                resultsList.innerHTML =
                    "";


                // دروستکردنی ڕیزبەندی

                entries.forEach(
                    function (
                        [resultId, result],
                        index
                    ) {

                        const resultCard =
                            document.createElement(
                                "div"
                            );


                        resultCard.className =
                            "quiz-form";


                        resultCard.style.marginBottom =
                            "20px";


                        const medal =
                            index === 0
                                ? "🥇"
                                : index === 1
                                    ? "🥈"
                                    : index === 2
                                        ? "🥉"
                                        : "🏆";


                        resultCard.innerHTML = `

                            <h2>

                                ${medal}

                                ${index + 1}.

                                ${escapeHtml(
                                    result.studentName ||
                                    "بێ ناو"
                                )}

                            </h2>


                            <p>

                                نمرە:

                                <strong>
                                    ${result.score}
                                    /
                                    ${result.total}
                                </strong>

                            </p>


                            <p>

                                ڕێژە:

                                <strong>
                                    ${result.percentage}%
                                </strong>

                            </p>


                            <p>

                                کاتی ناردن:

                                ${formatDate(
                                    result.submittedAt
                                )}

                            </p>


                            <button
                                type="button"
                                class="secondary-btn delete-result"
                                data-id="${escapeHtml(
                                    resultId
                                )}"
                            >

                                سڕینەوە

                            </button>

                        `;


                        resultsList.appendChild(
                            resultCard
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "Error loading results:",
                    error
                );


                loading.textContent =
                    "کێشەیەک ڕوویدا لە بارکردنی ئەنجامەکان.";

            }

        }


        // سڕینەوەی ئەنجام

        document.addEventListener(
            "click",
            async function (event) {

                if (
                    !event.target.classList.contains(
                        "delete-result"
                    )
                ) {

                    return;

                }


                const resultId =
                    event.target.dataset.id;


                const confirmed =
                    confirm(
                        "دڵنیایت دەتەوێت ئەم ئەنجامە بسڕیتەوە؟"
                    );


                if (!confirmed) {

                    return;

                }


                try {

                    const resultRef =
                        ref(
                            database,
                            "results/" +
                            quizId +
                            "/" +
                            resultId
                        );


                    await remove(
                        resultRef
                    );


                    event.target
                        .closest(".quiz-form")
                        .remove();


                    alert(
                        "ئەنجامەکە بە سەرکەوتوویی سڕایەوە."
                    );


                    // دووبارە بارکردنی ئەنجامەکان
                    // بۆ نوێکردنەوەی ئامارەکان

                    loadResults();


                } catch (error) {

                    console.error(
                        "Error deleting result:",
                        error
                    );


                    alert(
                        "کێشەیەک ڕوویدا لە سڕینەوەی ئەنجامەکە."
                    );

                }

            }
        );


        // فۆرماتی کات

        function formatDate(timestamp) {

            if (!timestamp) {

                return "نەزانراو";

            }


            const date =
                new Date(timestamp);


            return date.toLocaleString(
                "ckb-IQ",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        // پاراستنی HTML

        function escapeHtml(text) {

            return String(text)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }

    </script>

</body>

</html>
