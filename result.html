<!DOCTYPE html>

<html lang="ckb" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        ئەنجام - پرسیار لە ئێمە و وەڵام لە تۆ
    </title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>

<div class="quiz-container">

    <header class="quiz-header">

        <div class="logo">
            پرسیار لە ئێمە و وەڵام لە تۆ
        </div>

    </header>


    <main class="create-content">

        <div class="result-card">

            <div class="result-icon">
                ✓
            </div>


            <h1>
                ئەنجامی تاقیکردنەوە
            </h1>


            <p id="student-name">
                ناوی خوێندکار
            </p>


            <div class="score-box">

                <span>
                    نمرەکەت
                </span>


                <strong id="score">
                    0
                </strong>


                <small id="total">
                    لە 0
                </small>

            </div>


            <div
                class="result-message"
                id="result-message">

                تاقیکردنەوەکەت بە سەرکەوتوویی تەواو کرد!

            </div>


            <!-- STUDENT TABLE BUTTON -->

            <a
                href="student-table.html"
                class="student-table-button">

                بینینی خشتەی خوێندکاران

            </a>


            <!-- NOTE BUTTON -->

            <button
                id="note-button"
                class="student-table-button">

                📝 تێبینی

            </button>


            <!-- NOTE BOX -->

            <div
                id="note-box"
                class="note-box"
                style="display: none;">

                <textarea
                    id="student-note"
                    placeholder="تێبینیت لەسەر ئەم تاقیکردنەوەیە بنووسە..."
                    maxlength="1000"></textarea>


                <div class="note-actions">

                    <button
                        id="save-note"
                        class="primary-btn">

                        پاشەکەوتکردنی تێبینی

                    </button>


                    <button
                        id="cancel-note"
                        class="secondary-btn">

                        داخستن

                    </button>

                </div>

            </div>


        </div>

    </main>

</div>


<script type="module">

    import {
        database
    } from "./js/firebase.js";


    import {
        ref,
        update
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    /* =====================================================
       URL PARAMETERS
       ===================================================== */

    const urlParams =
        new URLSearchParams(
            window.location.search
        );


    const quizId =
        urlParams.get("id");


    const resultId =
        urlParams.get("resultId");


    const studentName =
        urlParams.get("name");


    const score =
        urlParams.get("score");


    const total =
        urlParams.get("total");


    /* =====================================================
       DISPLAY STUDENT NAME
       ===================================================== */

    if (studentName) {

        document.getElementById(
            "student-name"
        ).textContent =
            studentName;

    }


    /* =====================================================
       DISPLAY SCORE
       ===================================================== */

    if (score !== null) {

        document.getElementById(
            "score"
        ).textContent =
            score;

    }


    /* =====================================================
       DISPLAY TOTAL
       ===================================================== */

    if (total !== null) {

        document.getElementById(
            "total"
        ).textContent =
            "لە " + total;

    }


    /* =====================================================
       RESULT MESSAGE
       ===================================================== */

    if (
        score !== null &&
        total !== null &&
        Number(total) > 0
    ) {

        const percentage =
            (
                Number(score) /
                Number(total)
            ) * 100;


        const message =
            document.getElementById(
                "result-message"
            );


        if (
            percentage >= 90
        ) {

            message.textContent =
                "زۆر باشە! ئەنجامێکی نایابە.";

        } else if (
            percentage >= 70
        ) {

            message.textContent =
                "باشە! بەردەوام بە.";

        } else if (
            percentage >= 50
        ) {

            message.textContent =
                "باشە، بەڵام هێشتا دەتوانیت باشتر بیت.";

        } else {

            message.textContent =
                "هەوڵێکی باش بوو. دووبارە هەوڵ بدەرەوە!";

        }

    }


    /* =====================================================
       NOTE ELEMENTS
       ===================================================== */

    const noteButton =
        document.getElementById(
            "note-button"
        );


    const noteBox =
        document.getElementById(
            "note-box"
        );


    const studentNote =
        document.getElementById(
            "student-note"
        );


    const saveNoteButton =
        document.getElementById(
            "save-note"
        );


    const cancelNoteButton =
        document.getElementById(
            "cancel-note"
        );


    /* =====================================================
       OPEN NOTE BOX
       ===================================================== */

    noteButton.addEventListener(
        "click",
        function () {

            noteBox.style.display =
                "block";


            noteButton.style.display =
                "none";


            studentNote.focus();

        }
    );


    /* =====================================================
       CANCEL NOTE
       ===================================================== */

    cancelNoteButton.addEventListener(
        "click",
        function () {

            noteBox.style.display =
                "none";


            noteButton.style.display =
                "inline-block";

        }
    );


    /* =====================================================
       SAVE NOTE TO FIREBASE
       ===================================================== */

    saveNoteButton.addEventListener(
        "click",
        async function () {

            const note =
                studentNote.value.trim();


            if (
                note === ""
            ) {

                alert(
                    "تکایە تێبینییەکە بنووسە."
                );

                studentNote.focus();

                return;

            }


            if (
                !quizId ||
                !resultId
            ) {

                alert(
                    "نەتوانرا زانیاری ئەنجامەکە بدۆزرێتەوە."
                );

                return;

            }


            saveNoteButton.disabled =
                true;


            saveNoteButton.textContent =
                "پاشەکەوت دەکرێت...";


            try {

                const resultRef =
                    ref(
                        database,
                        "results/" +
                        quizId +
                        "/" +
                        resultId
                    );


                await update(
                    resultRef,
                    {

                        note:
                            note,

                        noteUpdatedAt:
                            Date.now()

                    }
                );


                saveNoteButton.textContent =
                    "پاشەکەوت کرا ✓";


                studentNote.disabled =
                    true;


                cancelNoteButton.style.display =
                    "none";


            } catch (error) {

                console.error(
                    "Note save error:",
                    error
                );


                alert(
                    "کێشەیەک ڕوویدا لە پاشەکەوتکردنی تێبینییەکە."
                );


                saveNoteButton.disabled =
                    false;


                saveNoteButton.textContent =
                    "پاشەکەوتکردنی تێبینی";

            }

        }
    );

</script>

</body>

</html>
